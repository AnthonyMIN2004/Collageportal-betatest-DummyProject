# ── KIRITAN PORTAL | NGINX CONFIG (Raspberry Pi) ──
# Serves the frontend as static files and proxies /api/* to uvicorn.
#
# Install:  sudo cp deploy/nginx.conf /etc/nginx/sites-available/kiritan-portal
#           sudo ln -s /etc/nginx/sites-available/kiritan-portal /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
#
# For HTTPS, run certbot after this is working:
#           sudo certbot --nginx -d your-domain.example.com

server {
    listen 80;
    server_name _;  # replace with your domain when you have one

    # Frontend — the repo root (index.html, style.css, js/)
    root /home/pi/Collageportal-betatest-DummyProject;
    index index.html;

    # Basic security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy no-referrer-when-downgrade;

    location / {
        try_files $uri $uri/ =404;
    }

    # Backend API — strips the /api prefix and forwards to uvicorn.
    # The frontend (js/api.js) calls /api/... when served from here.
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Never serve the database or python files by accident
    location ~ \.(db|py)$ { deny all; }
}
